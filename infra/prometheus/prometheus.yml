# Métricas dos serviços chegam por push OTLP (flag --web.enable-otlp-receiver) via OTel
# Collector; as do RabbitMQ vêm por scrape do plugin rabbitmq_prometheus (porta 15692).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # service.name vira o rótulo job; estes atributos também viram rótulos
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # o push OTLP pode chegar fora de ordem
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas por fila (profundidade, consumidores e entregas confirmadas), com o rótulo queue.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        [queue_coarse_metrics, queue_consumer_count, queue_delivery_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

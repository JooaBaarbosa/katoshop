# Métricas chegam por push OTLP (flag --web.enable-otlp-receiver) via OTel Collector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # service.name vira o rótulo job; estes atributos também viram rótulos
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # o push OTLP pode chegar fora de ordem
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

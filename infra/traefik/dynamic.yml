# Rotas do gateway api.katoshop.localhost (os prefixos /identity, /catalog, /cart e
# /promotions são removidos antes de chegar aos serviços), da loja em katoshop.localhost e do
# painel em admin.katoshop.localhost.
http:
  routers:
    # Rotas só de serviço para serviço (rede interna do compose): o router genérico de cada
    # serviço casaria com elas, então este bloqueio tem prioridade acima de todos e responde
    # 404 sem chegar ao serviço. O cart não tem rota interna; o promotions só publica o admin.
    internal-block:
      rule: >-
        Host(`api.katoshop.localhost`) && (PathPrefix(`/catalog/v1/internal`)
        || PathPrefix(`/identity/v1/auth/service-token`)
        || PathPrefix(`/promotions/v1/promotions`))
      entryPoints: [web]
      middlewares: [internal-not-found]
      service: noop@internal
      priority: 1000

    # Só endpoints de credencial (R15). Refresh e logout ficam de fora: os BFFs do Next
    # saem pelo mesmo IP e esgotariam o balde renovando sessões no SSR.
    identity-auth:
      rule: >-
        Host(`api.katoshop.localhost`) && (Path(`/identity/v1/auth/login`)
        || Path(`/identity/v1/auth/staff/login`) || Path(`/identity/v1/auth/register`))
      entryPoints: [web]
      middlewares: [auth-ratelimit, identity-strip]
      service: identity
      priority: 200

    identity:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/identity`)"
      entryPoints: [web]
      middlewares: [identity-strip]
      service: identity
      priority: 100

    catalog:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/catalog`)"
      entryPoints: [web]
      middlewares: [catalog-body-limit, catalog-strip]
      service: catalog
      priority: 100

    cart:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/cart`)"
      entryPoints: [web]
      middlewares: [cart-body-limit, cart-strip]
      service: cart
      priority: 100

    # Só o admin do promotions é público; o evaluate fica na rede interna (e no internal-block).
    promotions-admin:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/promotions/v1/admin`)"
      entryPoints: [web]
      middlewares: [promotions-strip]
      service: promotions
      priority: 100

    # R24: o Next 16 despacha Server Actions pelo cabeçalho Next-Action, em qualquer caminho
    # (um POST em / com o id do loginAction chega ao login sem passar pelo router de /entrar).
    # Todo POST de Server Action é limitado por IP de cliente, nas duas apps.
    storefront-actions:
      rule: >-
        Host(`katoshop.localhost`) && Method(`POST`)
        && HeaderRegexp(`Next-Action`, `.+`)
      entryPoints: [web]
      middlewares: [auth-ratelimit]
      service: storefront
      priority: 300

    # R20: login e cadastro chegam ao identity pelo IP do container da loja, então o limite
    # por IP do gateway virou um balde global. Aqui o limite volta a ser por cliente.
    # Mantido ao lado do R24: sem JavaScript o formulário posta o id da action no corpo, sem o
    # cabeçalho Next-Action, então só o caminho identifica o login e o cadastro.
    storefront-auth:
      rule: >-
        Host(`katoshop.localhost`) && Method(`POST`)
        && (Path(`/entrar`) || Path(`/criar-conta`))
      entryPoints: [web]
      middlewares: [auth-ratelimit]
      service: storefront
      priority: 200

    storefront:
      rule: "Host(`katoshop.localhost`)"
      entryPoints: [web]
      service: storefront
      priority: 100

    # R24 no painel (ver storefront-actions).
    admin-actions:
      rule: >-
        Host(`admin.katoshop.localhost`) && Method(`POST`)
        && HeaderRegexp(`Next-Action`, `.+`)
      entryPoints: [web]
      middlewares: [auth-ratelimit]
      service: admin
      priority: 300

    # R20 no painel: o login de funcionário também sai do container do admin para o identity.
    # Cobre o POST sem JavaScript (sem cabeçalho Next-Action), como storefront-auth.
    admin-auth:
      rule: "Host(`admin.katoshop.localhost`) && Method(`POST`) && Path(`/entrar`)"
      entryPoints: [web]
      middlewares: [auth-ratelimit]
      service: admin
      priority: 200

    admin:
      rule: "Host(`admin.katoshop.localhost`)"
      entryPoints: [web]
      service: admin
      priority: 100

  middlewares:
    # O noop@internal responde 418 sem corpo; aqui o 418 vira 404 (corpo vazio, nada do serviço).
    internal-not-found:
      errors:
        status: ["418"]
        service: noop@internal
        query: "/"
        statusRewrites:
          "418": 404

    identity-strip:
      stripPrefix:
        prefixes: ["/identity"]

    catalog-strip:
      stripPrefix:
        prefixes: ["/catalog"]

    cart-strip:
      stripPrefix:
        prefixes: ["/cart"]

    promotions-strip:
      stripPrefix:
        prefixes: ["/promotions"]

    # Login, login de staff e cadastro (gateway) e todo POST de Server Action ou de formulário
    # de login/cadastro das apps: 10 req/s em média, rajada de 20, por IP de origem. O Traefik
    # instancia o balde por router.
    auth-ratelimit:
      rateLimit:
        average: 10
        burst: 20
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0

    # Teto real do corpo (upload de imagem até 8 MiB + folga do multipart): 9 MiB.
    catalog-body-limit:
      buffering:
        maxRequestBodyBytes: 9437184

    # O carrinho só recebe JSON pequeno: 64 KiB (acima disso o gateway responde 413).
    cart-body-limit:
      buffering:
        maxRequestBodyBytes: 65536

  services:
    identity:
      loadBalancer:
        servers:
          - url: "http://identity:8000"

    catalog:
      loadBalancer:
        servers:
          - url: "http://catalog:8000"

    cart:
      loadBalancer:
        servers:
          - url: "http://cart:8000"

    promotions:
      loadBalancer:
        servers:
          - url: "http://promotions:8000"

    storefront:
      loadBalancer:
        servers:
          - url: "http://storefront:3000"

    admin:
      loadBalancer:
        servers:
          - url: "http://admin:3000"

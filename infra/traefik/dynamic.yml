# Rotas do gateway api.katoshop.localhost (os prefixos /identity e /catalog são
# removidos antes de chegar aos serviços) e da loja em katoshop.localhost.
http:
  routers:
    # Só endpoints de credencial (R15). Refresh e logout ficam de fora: os BFFs do Next
    # saem pelo mesmo IP e esgotariam o balde renovando sessões no SSR.
    identity-auth:
      rule: >-
        Host(`api.katoshop.localhost`) && (Path(`/identity/v1/auth/login`)
        || Path(`/identity/v1/auth/staff/login`) || Path(`/identity/v1/auth/register`))
      entryPoints: [web]
      middlewares: [auth-ratelimit, identity-strip]
      service: identity
      priority: 200

    identity:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/identity`)"
      entryPoints: [web]
      middlewares: [identity-strip]
      service: identity
      priority: 100

    catalog:
      rule: "Host(`api.katoshop.localhost`) && PathPrefix(`/catalog`)"
      entryPoints: [web]
      middlewares: [catalog-body-limit, catalog-strip]
      service: catalog
      priority: 100

    storefront:
      rule: "Host(`katoshop.localhost`)"
      entryPoints: [web]
      service: storefront
      priority: 100

  middlewares:
    identity-strip:
      stripPrefix:
        prefixes: ["/identity"]

    catalog-strip:
      stripPrefix:
        prefixes: ["/catalog"]

    # Login, login de staff e cadastro: 10 req/s em média, rajada de 20, por IP de origem.
    auth-ratelimit:
      rateLimit:
        average: 10
        burst: 20
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0

    # Teto real do corpo (upload de imagem até 8 MiB + folga do multipart): 9 MiB.
    catalog-body-limit:
      buffering:
        maxRequestBodyBytes: 9437184

  services:
    identity:
      loadBalancer:
        servers:
          - url: "http://identity:8000"

    catalog:
      loadBalancer:
        servers:
          - url: "http://catalog:8000"

    storefront:
      loadBalancer:
        servers:
          - url: "http://storefront:3000"

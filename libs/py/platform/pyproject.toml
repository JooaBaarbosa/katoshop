[project]
name = "katoshop-platform"
version = "0.1.0"
description = "Biblioteca compartilhada dos serviços KatoShop"
requires-python = ">=3.15,<3.16"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ks_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

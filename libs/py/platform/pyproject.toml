[project]
name = "katoshop-platform"
version = "0.1.0"
description = "Biblioteca compartilhada dos serviços KatoShop"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.5",
    "pydantic-settings==2.16.2",
    "opentelemetry-api==1.45.2",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-asyncpg==0.66b2",
    "SQLAlchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
]

[project.optional-dependencies]
testing = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "testcontainers[postgres]==4.15.0",
    "asgi-lifespan==2.1.0",
    "alembic==1.20.1",
]

[dependency-groups]
dev = [
    "katoshop-platform[testing]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ks_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "katoshop"
version = "0.1.0"
description = "KatoShop: e-commerce demonstrativo em microsserviços"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["libs/py/platform", "services/*"]

[tool.uv.sources]
katoshop-platform = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.15"
include = ["libs", "services"]
exclude = ["**/.venv", "**/node_modules"]

[tool.ruff.lint.isort]
known-first-party = ["ks_platform", "identity", "catalog"]

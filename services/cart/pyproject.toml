[project]
name = "cart"
version = "0.1.0"
description = "Serviço de carrinho do KatoShop"
requires-python = ">=3.15,<3.16"
dependencies = [
    "katoshop-platform",
    "fastapi==0.162.5",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "katoshop-platform[testing]",
    "pytest-cov==7.1.0",
]

[tool.uv.sources]
katoshop-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

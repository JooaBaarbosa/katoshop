[project]
name = "catalog"
version = "0.1.0"
description = "Serviço de catálogo do KatoShop"
requires-python = ">=3.15,<3.16"
dependencies = [
    "katoshop-platform",
    "fastapi==0.162.5",
    "pydantic-settings==2.16.2",
    "SQLAlchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "uvicorn==0.54.0",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = [
    "katoshop-platform[testing]",
    "pytest-cov==7.1.0",
]

[tool.uv.sources]
katoshop-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

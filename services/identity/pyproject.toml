[project]
name = "identity"
version = "0.1.0"
description = "Serviço de identidade do KatoShop"
requires-python = ">=3.15,<3.16"
dependencies = [
    "katoshop-platform",
    "fastapi==0.162.0",
    "pydantic-settings==2.16.1",
    "SQLAlchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "katoshop-platform[testing]",
]

[tool.uv.sources]
katoshop-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
